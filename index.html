<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つながる新天地 品質MAXチェック表</title><style>body{font-family:system-ui,sans-serif;background:#fff8ed;color:#473b32;margin:0}main{max-width:850px;margin:auto;padding:20px}h1{font-size:1.6rem}header,.panel{background:white;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}progress{width:100%;height:20px;accent-color:#5aab72}input[type=search]{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:1rem}.tabs{display:flex;flex-wrap:wrap;gap:7px}.tabs button{padding:9px 13px;border:1px solid #b8c7b2;background:#fff;border-radius:20px;cursor:pointer}.tabs button.active{background:#377e55;color:white}label.item{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #eee;font-size:1.05rem}label.item input{width:22px;height:22px;accent-color:#377e55}label.done span{text-decoration:line-through;color:#777}.muted{color:#706b65;font-size:.9rem}button.reset{border:1px solid #b44;color:#a33;background:white;border-radius:8px;padding:8px}#count{font-weight:bold}</style></head><body><main><header><h1>🌱 つながる新天地 品質MAXチェック表</h1><p>品質MAXを達成したらチェック！</p><div id="count"></div><progress id="progress" max="100" value="0"></progress><p class="muted">チェックはこのブラウザ内に保存されます。別の端末には自動同期されません。</p></header><section class="panel"><input id="search" type="search" placeholder="🔎 作物名を検索"><p class="muted">カテゴリーを選んでチェックしてね</p><nav class="tabs" id="tabs"></nav></section><section class="panel"><h2 id="heading"></h2><div id="items"></div></section><section class="panel"><p class="muted">※これは動作確認用の初期リストです。全栽培品目の網羅性・ゲーム内表記は未確認です。確認後に追加・修正できます。</p><button class="reset" id="reset">チェックをすべて解除</button></section></main><script>
const data={"野菜":["かぶ","じゃがいも","きゅうり","キャベツ","トマト","とうもろこし","たまねぎ","にんじん","ほうれんそう","なす","さつまいも","ピーマン","だいこん","はくさい","ブロッコリー","かぼちゃ"],"果樹":["りんご","ぶどう","もも","バナナ","オレンジ","さくらんぼ","マンゴー","レモン"],"花":["マーガレット","チューリップ","カーネーション","バラ","ひまわり","あじさい","ユリ"],"穀物・その他":["小麦","大豆","お米","茶葉","綿花","亜麻"]};
const key='bokumono-max-v1';let checked={};try{checked=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}let category='すべて';const all=Object.entries(data).flatMap(([group,names])=>names.map(name=>({group,name,id:group+':'+name})));const tabs=document.getElementById('tabs'),items=document.getElementById('items'),heading=document.getElementById('heading'),search=document.getElementById('search');function render(){const total=all.length,done=all.filter(x=>checked[x.id]).length,pct=Math.round(done/total*100);document.getElementById('count').textContent=`${done} / ${total} 達成（${pct}%）`;document.getElementById('progress').value=pct;tabs.replaceChildren();for(const c of ['すべて',...Object.keys(data)]){const b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;render()};tabs.append(b)}const q=search.value.trim().toLowerCase();const shown=all.filter(x=>(category==='すべて'||x.group===category)&&x.name.toLowerCase().includes(q));heading.textContent=`${category}（${shown.filter(x=>checked[x.id]).length}/${shown.length}）`;items.replaceChildren();for(const x of shown){const l=document.createElement('label');l.className='item'+(checked[x.id]?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!checked[x.id];cb.onchange=()=>{if(cb.checked)checked[x.id]=true;else delete checked[x.id];try{localStorage.setItem(key,JSON.stringify(checked))}catch(e){alert('保存できませんでした。ブラウザの設定を確認してください。')}render()};const s=document.createElement('span');s.textContent=x.name;l.append(cb,s);items.append(l)}if(!shown.length)items.textContent='該当する作物がありません。'}search.oninput=render;document.getElementById('reset').onclick=()=>{if(confirm('すべてのチェックを解除しますか？')){checked={};localStorage.setItem(key,'{}');render()}};render();
</script></body></html>
