
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆいの品質MAX牧場</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7e9;color:#52604b;font-family:"Yu Gothic",sans-serif}
header{text-align:center;padding:30px 12px;background:linear-gradient(120deg,#d9efd0,#ffebce);border-bottom:6px solid #bdd5a6}
h1{font-size:clamp(23px,5vw,36px);margin:12px 0}
.animals{font-size:32px;letter-spacing:7px}
main{max-width:1050px;margin:auto;padding:16px}
section{background:#fffefa;border:2px solid #eadfc7;border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 4px #eee3cd}
.stats{font-size:24px;font-weight:bold;margin-bottom:12px}
.track{background:#e6e7d9;border-radius:20px;height:20px;overflow:hidden}
#bar{height:100%;width:0;background:#83bb77;transition:.2s}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
button{background:white;border:2px solid #c8d6b9;border-radius:22px;padding:10px 14px;color:#426449;cursor:pointer;font-weight:bold}
button.active{background:#568766;color:white}
#search{width:100%;padding:14px;border:2px solid #cadabf;border-radius:14px;font-size:17px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:14px;background:white;border:1px solid #e6ddc9;border-radius:14px;cursor:pointer}
.item.done{background:#e3f3df;border-color:#9dc697}
.item input{width:25px;height:25px;accent-color:#568766;flex-shrink:0}
.item small{display:block;color:#818579;margin-top:5px}
.note{font-size:13px;line-height:1.8}
footer{text-align:center;padding:24px}
</style>
</head>
<body>
<header>
<div class="animals">🐮 🐥 🐑 🐰 🐴</div>
<h1>🌷 ゆいの品質MAX牧場 🌷</h1>
<p>牧場物語 つながる新天地</p>
<p>ひとつずつ育てて、目指せコンプリート！ ⭐</p>
</header>
<main>
<section>
<div class="stats" id="stats"></div>
<div class="track"><div id="bar"></div></div>
<p>🌱 チェックは自動保存されるよ！</p>
</section>
<section>
<input id="search" type="search" placeholder="🔎 作物の名前を検索">
<h3>🌸 季節で探す</h3>
<div class="filters" id="seasons"></div>
<h3>🌾 種類で探す</h3>
<div class="filters" id="types"></div>
<p id="count"></p>
</section>
<section>
<h2>🐥 品質MAXチェックリスト</h2>
<div class="items" id="items"></div>
</section>
<section class="note">
<p>🌸 季節・品目は確認を続けている改良版です。全品目の完全網羅は未検証です。</p>
<p>🌳 果樹は収穫季節を目安に分類しています。</p>
<p>💾 記録はブラウザごとに保存されます。別端末には自動同期されません。</p>
</section>
</main>
<footer>🐮 今日も素敵な牧場日和 🌷</footer>
<script>
const groups=[
["春","野菜","かぶ,黄金かぶ,じゃがいも,黄金じゃがいも,きゃべつ,黄金きゃべつ,きゅうり,いちご"],
["春","花","ピンクローズ,マーガレット,チューリップ"],
["夏","野菜","トマト,黄金トマト,とうもろこし,黄金とうもろこし,たまねぎ,かぼちゃ,パイナップル,すいか,黄金すいか,メロン,黄金メロン"],
["夏","花","ひまわり,レッドローズ,あじさい"],
["秋","野菜","ほうれんそう,ごぼう,にんじん,なす,さつまいも,ピーマン,アンデスイモ"],
["秋","花","なでしこ,ホワイトローズ,ガーベラ"],
["冬","野菜","だいこん,はくさい,黄金はくさい,ブロッコリー,黄金ブロッコリー"],
["冬","花","スノードロップ,りんどう,ブルーローズ"],
["春","果樹","さくらんぼ"],
["夏","果樹","もも,バナナ,マンゴー,アーモンド"],
["秋","果樹","りんご,ぶどう,カカオ,キウイ,レモン,マスカット,オリーブ"],
["冬","果樹","オレンジ"],
["通年","穀物","小麦,大豆"],
["通年","水田","お米,れんこん,わさび"],
["通年","花","サボテン"],
["通年","その他","サトウキビ,唐辛子,亜麻,綿花,茶葉,牧草"],
["通年","きのこ","しいたけ,しめじ,エリンギ,ホウキタケ,マッシュルーム,どくきのこ"]
];
const data=groups.flatMap(([season,type,names])=>
 names.split(",").map(name=>({season,type,name}))
);
const key="bokumono-max-v2";
let saved={};
try{
 saved=JSON.parse(localStorage.getItem(key)||"{}")||{};
 const old=JSON.parse(localStorage.getItem("bokumono-max-v1")||"{}")||{};
 for(const x of data){
  if(saved[x.name]===undefined &&
    (old[x.name]===true || old[x.type+"|"+x.name]===true)){
   saved[x.name]=true;
  }
 }
}catch(e){}
let season="すべて",type="すべて";
const $=id=>document.getElementById(id);
function makeButtons(id,values,current,change){
 $(id).innerHTML="";
 values.forEach(v=>{
  const b=document.createElement("button");
  b.textContent=v;
  b.className=v===current?"active":"";
  b.onclick=()=>{change(v);render()};
  $(id).appendChild(b);
 });
}
function render(){
 makeButtons("seasons",
 ["すべて","春","夏","秋","冬","通年"],
 season,v=>season=v);
 makeButtons("types",
 ["すべて",...new Set(data.map(x=>x.type))],
 type,v=>type=v);
 const q=$("search").value.trim();
 const rows=data.filter(x=>
  (season==="すべて"||x.season===season)&&
  (type==="すべて"||x.type===type)&&
  x.name.includes(q)
 );
 const done=data.filter(x=>saved[x.name]).length;
 const percent=Math.round(done/data.length*100);
 $("stats").textContent=`${done} / ${data.length} 達成（${percent}%）`;
 $("bar").style.width=percent+"%";
 $("count").textContent=`表示中 ${rows.length} 件`;
 $("items").innerHTML="";
 rows.forEach(x=>{
  const label=document.createElement("label");
  label.className="item"+(saved[x.name]?" done":"");
  const cb=document.createElement("input");
  cb.type="checkbox";
  cb.checked=!!saved[x.name];
  cb.onchange=()=>{
   saved[x.name]=cb.checked;
   try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}
   render();
  };
  const span=document.createElement("span");
  const b=document.createElement("b");
  b.textContent=x.name;
  const small=document.createElement("small");
  small.textContent=x.season+" ・ "+x.type;
  span.append(b,small);
  label.append(cb,span);
  $("items").appendChild(label);
 });
}
$("search").addEventListener("input",render);
render();
</script>
</body>
</html>
