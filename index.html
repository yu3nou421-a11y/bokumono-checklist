<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4e9c9"><title>つながる新天地 🌷 品質MAX牧場</title><style>
:root{font-family:'Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;color:#38513c;background:#f9f5e8}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(0deg,#f9f5e8,#f9f5e8 37px,#f7f0dc 38px)}header{background:linear-gradient(#cbe9f3 0 72%,#9bcf85 72%);padding:28px 15px 36px;text-align:center;border-bottom:9px solid #77aa68}.animals{font-size:clamp(35px,9vw,67px);letter-spacing:12px;filter:drop-shadow(0 3px 1px #ffffff88)}h1{margin:8px 0;font-size:clamp(23px,5vw,36px);color:#46623e;text-shadow:2px 2px white}header p{margin:4px}.wrap{max-width:1050px;margin:auto;padding:18px 14px 65px}.panel{background:#fffdf6;border:3px solid #d8bd85;border-radius:22px;box-shadow:0 5px 0 #d8bd8555;padding:18px;margin-bottom:18px}.stats{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.big{font-size:28px;font-weight:900;color:#658c48}.bar{height:18px;background:#e9e9d9;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#a3d86e,#61b47e);transition:width .2s}.controls{display:grid;gap:12px}input[type=search]{width:100%;padding:13px 16px;border:2px solid #c8d5b6;border-radius:15px;font-size:16px;background:#fff}.buttons{display:flex;gap:7px;flex-wrap:wrap}.buttons button{border:2px solid #d0d8bd;background:#fff;border-radius:999px;padding:9px 13px;color:#466044;font-weight:700;cursor:pointer}.buttons button.active{background:#6e9b69;color:white;border-color:#6e9b69}.category{margin:23px 0}.category h2{font-size:21px;margin:0 0 10px;background:#e5eed8;border-left:8px solid #87b87b;border-radius:10px;padding:10px 14px}.season{margin:13px 0 20px}.season h3{font-size:16px;margin:0 0 9px;padding:8px 12px;background:#f8ead0;border-radius:10px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}.item{display:flex;align-items:center;gap:10px;min-height:55px;padding:10px 12px;background:white;border:2px solid #e2dfcc;border-radius:13px;cursor:pointer;font-size:15px;font-weight:650;overflow-wrap:anywhere}.item:has(input:checked){background:#e4f3d9;border-color:#83b779}.item input{width:22px;height:22px;accent-color:#669b60;flex:none}.item .gold{color:#b48220}.item:has(input:checked) .name{text-decoration:line-through;opacity:.68}.mini{color:#71806e;font-size:13px}.footer{text-align:center;color:#6f806a;font-size:13px;margin-top:30px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid #c9cbb8;background:#fff;border-radius:10px;padding:9px 12px;color:#53674b;cursor:pointer}.hidden{display:none!important}@media(max-width:500px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{font-size:13px;padding:8px;gap:6px}.item input{width:20px;height:20px}.panel{padding:13px}.animals{letter-spacing:3px}}
</style></head><body><header><div class="animals" aria-label="牧場の動物たち">🐮 🐑 🦙 🐔</div><h1>🌷 品質MAX 牧場チェック帳 🌷</h1><p>牧場物語 つながる新天地</p><p>🌱 ひとつずつ育てて、ぜんぶコンプリート！ 🌱</p></header><main class="wrap"><section class="panel"><div class="stats"><div><strong>🏆 全体の達成率</strong><div class="mini" id="counts"></div></div><div class="big" id="percent">0%</div></div><div class="bar" role="progressbar" aria-label="全体の達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><div class="actions"><button id="showIncomplete">☐ 未達成だけ表示</button><button id="export">💾 バックアップ保存</button><button id="import">📂 バックアップ読込</button><input id="file" type="file" accept="application/json" hidden></div></section><section class="panel controls"><input type="search" id="search" placeholder="🔎 作物の名前で検索" aria-label="作物を検索"><div class="mini">季節で絞り込み</div><div class="buttons" id="seasons"></div><div class="mini">種類で絞り込み</div><div class="buttons" id="categories"></div></section><div id="list"></div><p class="footer">🐮 🐑 🦙 🐔　ゆいの品質MAX牧場　🌻<br>チェックはこの端末のブラウザに自動保存されます。</p></main><script>
const DATA=[
['🥕 野菜','春','かぶ|黄金かぶ|じゃがいも|黄金じゃがいも|きゃべつ|黄金きゃべつ|きゅうり|黄金きゅうり|いちご|黄金いちご'],
['🥕 野菜','夏','たまねぎ|黄金たまねぎ|かぼちゃ|黄金かぼちゃ|トマト|黄金トマト|パプリカ|黄金パプリカ|とうもろこし|黄金とうもろこし|パイナップル|黄金パイナップル|すいか|黄金すいか|メロン|黄金メロン'],
['🥕 野菜','秋','ほうれんそう|黄金ほうれんそう|ごぼう|黄金ごぼう|にんじん|黄金にんじん|なす|黄金なす|さつまいも|黄金さつまいも|ピーマン|黄金ピーマン|アンデスイモ|黄金アンデスイモ'],
['🥕 野菜','冬','だいこん|黄金だいこん|はくさい|黄金はくさい|ブロッコリー|黄金ブロッコリー'],
['🌸 花','春','ピンクローズ|マーガレット|チューリップ|カーネーション'],['🌸 花','夏','ひまわり|レッドローズ|あじさい|ユリ|ハイビスカス'],['🌸 花','秋','なでしこ|ホワイトローズ|ガーベラ'],['🌸 花','冬','スノードロップ|りんどう|ブルーローズ'],['🌸 花','一年中','サボテン'],
['🌾 穀物・畑作物','一年中','お米|小麦|大豆|れんこん|わさび|サトウキビ|唐辛子'],
['🍎 果樹','春','さくらんぼ'],['🍎 果樹','夏','もも|バナナ|マンゴー|アーモンド'],['🍎 果樹','秋','りんご|ぶどう|カカオ|キウイ|レモン|マスカット|オリーブ'],['🍎 果樹','冬','オレンジ'],
['🍵 茶葉','春','茶葉'],['🍵 茶葉','夏','茶葉'],['🍵 茶葉','秋','茶葉'],
['🌿 その他・資材','一年中','綿花|亜麻|牧草|竹|広葉樹|針葉樹'],
['🍄 きのこ','一年中（春）','しいたけ|しめじ'],['🍄 きのこ','一年中（夏）','エリンギ|ホウキタケ'],['🍄 きのこ','一年中（秋）','マッシュルーム|どくきのこ'],['✨ 特別','一年中','ナゾの種']
];
const entries=DATA.flatMap(([category,season,names])=>names.split('|').map(name=>({category,season,name,id:category+'|'+season+'|'+name})));
const key='bokumono-quality-max-v3';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){};
let selectedSeason='すべて',selectedCategory='すべて',incomplete=false;
const seasonOptions=['すべて','春','夏','秋','冬','一年中'];const categoryOptions=['すべて',...new Set(entries.map(x=>x.category))];
function matchesSeason(e){return selectedSeason==='すべて'||(selectedSeason==='一年中'?e.season.startsWith('一年中'):e.season===selectedSeason)}
function makeButtons(id,options,selected,callback){const node=document.getElementById(id);node.replaceChildren();options.forEach(option=>{const b=document.createElement('button');b.textContent=option;b.className=option===selected?'active':'';b.setAttribute('aria-pressed',String(option===selected));b.onclick=()=>callback(option);node.append(b)})}
function refresh(){makeButtons('seasons',seasonOptions,selectedSeason,v=>{selectedSeason=v;refresh()});makeButtons('categories',categoryOptions,selectedCategory,v=>{selectedCategory=v;refresh()});const q=document.getElementById('search').value.trim().toLowerCase();const visible=entries.filter(e=>matchesSeason(e)&&(selectedCategory==='すべて'||e.category===selectedCategory)&&e.name.toLowerCase().includes(q)&&(!incomplete||!saved[e.id]));const root=document.getElementById('list');root.replaceChildren();const cats=[...new Set(visible.map(e=>e.category))];cats.forEach(cat=>{const section=document.createElement('section');section.className='category';const h2=document.createElement('h2');const all=entries.filter(e=>e.category===cat),done=all.filter(e=>saved[e.id]);h2.textContent=`${cat}　${done.length}/${all.length}`;section.append(h2);const group=visible.filter(e=>e.category===cat);[...new Set(group.map(e=>e.season))].forEach(season=>{const sub=document.createElement('section');sub.className='season';const h3=document.createElement('h3');h3.textContent=({'春':'🌷','夏':'🌻','秋':'🍁','冬':'❄️'}[season]||'🌿')+' '+season;sub.append(h3);const grid=document.createElement('div');grid.className='items';group.filter(e=>e.season===season).forEach(e=>{const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.checked=!!saved[e.id];input.setAttribute('aria-label',e.season+' '+e.name+' 品質MAX');input.onchange=()=>{saved[e.id]=input.checked;try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}refresh()};const name=document.createElement('span');name.className='name'+(e.name.startsWith('黄金')?' gold':'');name.textContent=e.name;label.append(input,name);grid.append(label)});sub.append(grid);section.append(sub)});root.append(section)});if(!visible.length){const p=document.createElement('p');p.className='panel';p.textContent='🌱 該当する作物はありません';root.append(p)}const done=entries.filter(e=>saved[e.id]).length;const pct=Math.round(done/entries.length*100);document.getElementById('counts').textContent=`${done} / ${entries.length} 種類 達成`;document.getElementById('percent').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';document.getElementById('progress').setAttribute('aria-valuenow',String(pct));document.getElementById('showIncomplete').textContent=incomplete?'☑ 全件表示に戻す':'☐ 未達成だけ表示'}
document.getElementById('search').addEventListener('input',refresh);document.getElementById('showIncomplete').onclick=()=>{incomplete=!incomplete;refresh()};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,checked:saved},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bokumono-quality-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.checked||typeof data.checked!=='object'||Array.isArray(data.checked))throw Error('invalid');if(!confirm('現在のチェック状態をバックアップの内容で置き換えますか？'))return;saved=Object.fromEntries(Object.entries(data.checked).filter(([k,v])=>entries.some(e=>e.id===k)&&typeof v==='boolean'));localStorage.setItem(key,JSON.stringify(saved));refresh();alert('読み込み完了！')}catch(err){alert('読み込めないファイルです')}e.target.value=''};refresh();
</script></body></html>
